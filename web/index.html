<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0eee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<title>Chat</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/theme-sync.js"></script>
</head>
<body>

<aside id="sidebar">
  <div class="brand serif"><span class="star">✳</span> Chat</div>
  <button id="new-chat">＋ New chat</button>
  <div class="section-label">Recents</div>
  <div id="convo-list"></div>
  <div id="status">Loading models…</div>
  <div class="section-label">MCP Servers</div>
  <div id="mcp-list" style="font-size: 0.8rem; margin-bottom: 1rem;"></div>
  <button id="open-settings" style="width: 100%; margin-bottom: 1rem; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font: inherit; font-weight: 500; cursor: pointer; transition: background .15s;">⚙ Settings</button>
</aside>

<section id="settings-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1100; overflow-y: auto; color: var(--text);">
  <div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
      <button id="close-settings" style="background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; justify-content: center; align-items: center;">✕</button>
      <h1 class="serif">Settings</h1>
    </div>
    
    <div class="section-label">Appearance</div>
    <div style="background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h3 class="serif" style="margin: 0;">Theme</h3>
          <p style="margin: 0; font-size: 0.85rem; color: var(--muted);">Select how the app looks</p>
        </div>
        <select id="theme-select" style="padding: 0.5rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;">
          <option value="system">System Default</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>

    <div class="section-label">Manage MCP Servers</div>
    <div id="settings-mcp-list" style="margin-bottom: 2rem; display: flex; flex-direction: column; gap: 0.5rem;"></div>
    
    <div style="background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border);">
      <h3 class="serif" style="margin-top: 0;">Add New Server</h3>
      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; flex-direction: column; gap: 0.25rem;">
          <label style="font-size: 0.8rem; opacity: 0.8;">Server Name</label>
          <input type="text" id="mcp-name" placeholder="e.g. Everything" style="padding: 0.6rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.25rem;">
          <label style="font-size: 0.8rem; opacity: 0.8;">Command</label>
          <input type="text" id="mcp-cmd" placeholder="e.g. npx @modelcontextprotocol/server-everything" style="padding: 0.6rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.25rem;">
          <label style="font-size: 0.8rem; opacity: 0.8;">Args (comma separated)</label>
          <input type="text" id="mcp-args" placeholder="e.g. --port 8080, --verbose" style="padding: 0.6rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
        </div>
        <button id="mcp-save" style="padding: 0.7rem; cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; align-self: flex-start; padding-left: 1.5rem; padding-right: 1.5rem;">Add Server</button>
      </div>
    </div>
  </div>
</section>
<section id="main">
  <div id="topbar">
    <button id="toggle-sidebar" title="Toggle sidebar">☰</button>
    <div id="chat-title"></div>
  </div>

  <div id="scroll">
    <div id="welcome">
      <div class="star">✳</div>
      <h1 class="serif">How can I help you today?</h1>
      <p>Pick a model below, or leave it on “recommended” and let the router decide.</p>
    </div>
    <div id="messages"></div>
  </div>

  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
      <div class="composer-row">
        <select id="model" title="Model"></select>
        <button id="send" title="Send (Enter)" disabled>↑</button>
      </div>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
