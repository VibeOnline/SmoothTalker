name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -v ./...

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o smoothtalker-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o smoothtalker-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o smoothtalker-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o smoothtalker-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smoothtalker-linux-amd64
            smoothtalker-darwin-amd64
            smoothtalker-darwin-arm64
            smoothtalker-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
